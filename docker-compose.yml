services:
  db:
    image: postgres:16-alpine
    container_name: financas-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: financas
      TZ: America/Sao_Paulo
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # executado apenas na primeira inicialização (volume vazio)
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d financas"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: financas-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3001
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: financas
      JWT_SECRET: ${JWT_SECRET:-segredo-local-apenas-para-desenvolvimento}
      JWT_EXPIRES_IN: 1h
      CORS_ORIGIN: http://localhost:5173
      TZ: America/Sao_Paulo
    # popula o banco na primeira vez (o seed é ignorado se já houver usuários) e sobe a API
    command: ["sh", "-c", "node database/seed.js && node src/server.js"]
    ports:
      - "3001:3001"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:3001/api
    container_name: financas-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
